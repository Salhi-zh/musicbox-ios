name: iOS

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref to save macOS minutes.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build app + core tests
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        # Pick the highest-versioned Xcode installed on the runner image.
        run: |
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # MusicboxCore is platform-agnostic (Foundation only) — validate it with
      # SwiftPM directly, the same gate that runs on Linux locally.
      - name: Test MusicboxCore (swift test)
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Build the iOS app for the Simulator (unsigned). This is the first place
      # the SwiftUI/AVFoundation app code is actually compiled.
      - name: Build app for iOS Simulator
        run: |
          xcodebuild \
            -project Musicbox.xcodeproj \
            -scheme Musicbox \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
