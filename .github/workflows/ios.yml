name: iOS

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref to save macOS minutes.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build app + core tests
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        # Pick the highest-versioned Xcode installed on the runner image.
        run: |
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # MusicboxCore is platform-agnostic (Foundation only) — validate it with
      # SwiftPM directly, the same gate that runs on Linux locally.
      - name: Test MusicboxCore (swift test)
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Build the app for a real iOS device, UNSIGNED. This both compiles the
      # SwiftUI/AVFoundation code (the compile gate) and produces the .app that
      # SideStore will re-sign with your free Apple ID on install.
      - name: Build unsigned iOS device app
        run: |
          xcodebuild \
            -project Musicbox.xcodeproj \
            -scheme Musicbox \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      # Package the unsigned .app into a Payload/*.ipa that SideStore accepts.
      - name: Package unsigned .ipa
        run: |
          APP="build/Build/Products/Debug-iphoneos/Musicbox.app"
          if [ ! -d "$APP" ]; then echo "app bundle not found at $APP"; ls -R build/Build/Products || true; exit 1; fi
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Musicbox-unsigned.ipa Payload
          ls -la Musicbox-unsigned.ipa

      - name: Upload unsigned .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Musicbox-unsigned-ipa
          path: Musicbox-unsigned.ipa
          if-no-files-found: error
